[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-forge-studio"
version = "0.1.0"
description = "Modular Python-first 2D/Pixel Art character production studio combining agent-sprite-forge, sprite-gen, and Claude-Code-Game-Studios QA standards."
readme = "README.md"
license = {text = "MIT AND Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "Pillow>=10.1.0,<13.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "jsonschema>=4.18.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
addopts = "-v"
